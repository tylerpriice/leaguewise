<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>projection-pacing.json generator</title>
</head>

<body>
    <!-- THE GENERATOR FOR tests/fixtures/projection-pacing.json. Run it through the static server and read the <pre>: chrome --headless=new --dump-dom http://localhost:8123/tests/projection-pacing.fixture.gen.html It imports the REAL projection-pacing.js and drives it with a REAL captured league - the live 2026 baseball league in full-mlb, which is the only capture carrying actual season lines BESIDE projections (a finished season's projection is spent, and a pre-draft league has no actuals at all). So the instance cannot drift from what the module emits, and the numbers in it are a real player's. Both league types are emitted from the SAME player: the capture is a CATEGORY league, so the roto shape is its natural answer and the points shape is produced by also passing isPointsLeague. This category league's scoringItems DO carry point values, which is why the model keys on the flag and never on whether weights are present, and why this generator is what caught that. The refusals are emitted as an explicit block rather than omitted, because "null, never a zeroed shape" is the part of the contract a renderer is most likely to get wrong. -->
    <pre id="out"></pre>

    <script type="module">
        import { projectionPacing } from '../projection-pacing.js';

        const CAP = 'JSON_debug/full-mlb';
        const league = await fetch(`../${CAP}/team.json`).then(r => r.json());
        const pool = await fetch(`../${CAP}/player-pool.json`).then(r => r.json());

        // The league's own scored ids and weights, off its scoring items - the same read data.js
        // makes. A category league carries no points, which is exactly why the roto shape below is
        // the capture's NATURAL answer and the points shape is the constructed one.
        const items = league?.settings?.scoringSettings?.scoringItems || [];
        const scoredIds = items.map(i => String(i.statId));
        const weights = {};
        items.forEach(i => { if (i.points) weights[String(i.statId)] = i.points; });

        // Baseball's validated ids (state.js): 81 games played, 34 outs, and the rate/inverse sets
        // named rather than re-derived here - a generator must not invent a stat map.
        const GAMES_ID = '81';
        const RATE_IDS = new Set(['2', '9', '17', '18', '35', '40', '41', '42', '43', '44', '45', '47']);
        const INVERSE_IDS = new Set(['24', '39', '37', '46']);
        // The labels come from the app's OWN validated map rather than a copy kept here - a
        // generator that spells its own stat names is a second, unvalidated stat map (golden rule 4).
        const { ESPN_STAT_MAPS } = await import('../state.js');
        const LABELS = ESPN_STAT_MAPS.flb;

        const unwrap = (line) => (line && line.stats) || {};
        const players = (pool.players || pool || []).map(entry => {
            const p = entry.player || entry;
            const lines = p.stats || [];
            const year = league.seasonId;
            const actual = lines.find(s => s.statSplitTypeId === 0 && s.statSourceId === 0 && s.seasonId === year);
            const proj = lines.find(s => s.statSplitTypeId === 0 && s.statSourceId === 1 && s.seasonId === year);
            return { name: p.fullName, seasonTotals: unwrap(actual), projectedTotals: unwrap(proj) };
        });

        const ctxBase = {
            scoredIds,
            gamesId: GAMES_ID,
            projectedGamesId: GAMES_ID,
            rateIds: RATE_IDS,
            inverseIds: INVERSE_IDS,
            statLabels: LABELS,
            seasonId: league.seasonId
        };

        // The first player the model actually answers for, so the instance is never a shape the
        // module would have refused.
        const subject = players.find(p => projectionPacing(p, ctxBase) !== null);

        const out = {
            // PROVENANCE WITHOUT THE CAPTURE OR THE LEAGUE ID (B218 O43). This one string was the
            // only private thing in the whole fixture - every other value is a public stat line or
            // a model output - so it was the entire reason the instance could not be published.
            // It names the KIND of league and the season, which is what a reader needs to judge the
            // instance. It does NOT name the capture: mirror-coverage.ps1 refuses a published
            // fixture that points at one, and a reader of the public repo has no JSON_debug to
            // point at anyway.
            _source: `a live ${league.seasonId} baseball league, generated by tests/projection-pacing.fixture.gen.html`,
            _player: subject ? subject.name : null,
            roto: projectionPacing(subject, ctxBase),
            points: projectionPacing(subject, { ...ctxBase, isPointsLeague: true, weights }),
            refusals: {
                noProjection: projectionPacing({ seasonTotals: subject.seasonTotals, projectedTotals: {} }, ctxBase),
                subFloor: projectionPacing(
                    { ...subject, seasonTotals: { ...subject.seasonTotals, [GAMES_ID]: 19 } }, ctxBase),
                noProjectedGames: projectionPacing(
                    { ...subject, projectedTotals: { ...subject.projectedTotals, [GAMES_ID]: 0 } }, ctxBase),
                noEligibleComponent: projectionPacing(subject, { ...ctxBase, scoredIds: [] }),
                football: projectionPacing(subject, { ...ctxBase, gamesId: null })
            }
        };
        document.getElementById('out').textContent = 'FIXTURE_JSON ' + JSON.stringify(out, null, 2);
    </script>
</body>

</html>
