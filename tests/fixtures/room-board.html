<!DOCTYPE html>
<!--
  A SYNTHETIC ESPN DRAFT BOARD (B267 item 4b), built to the structure measured on the owner's saved
  room page and recorded in tests/fixtures/room-feed.md Amendment 6: the header row of
  .draft-board-grid-header-cell with myTeam on the reader's own column, and .draftBoardGrid holding one
  .draft-board-grid-pick-cell.completedPick per made pick, each carrying `grid-area: <row> / <column>`,
  a .roundPick reading "<round>.<pickInRound>", the two name spans, the club and the position pill.

  EVERYTHING IN IT IS INVENTED - three teams, nine players, three-letter clubs - and it is deliberately
  the same nine picks as the `boardDom` block in room-feed.json, so a test can check the reader's own
  extraction against expectations that were hand-computed once.

  THE WHOLE BOARD SITS INSIDE `tab__item dn`, ESPN's own display-none utility, because that is how the
  measured page carried it: the Players tab was selected and all 286 cells were in the DOM behind
  display:none. A read that only worked on a visible board would work on nobody's room.

  The last two cells are the two negatives: one without `completedPick` (a slot whose pick has not been
  made - the form this structure has never been measured in, so it is never read), and one whose
  .roundPick is empty.
-->

<head><meta charset="utf-8"><title>synthetic draft board</title></head>
