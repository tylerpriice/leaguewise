<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>every suite, one pass</title>
    <style>
        body { font-family: monospace; padding: 20px; font-size: 13px; }
        h1 { font-size: 16px; }
        .pass { color: #2e7d32; }
        .fail { color: #c62828; font-weight: bold; }
        .absent { color: #8a6d1f; }
        #summary { font-size: 15px; font-weight: bold; margin: 12px 0; }
        table { border-collapse: collapse; }
        td { padding: 1px 14px 1px 0; vertical-align: top; }
        #frames { position: absolute; left: -9999px; top: 0; }
    </style>
</head>

<body>
    <!-- Every suite in one pass. Each suite is loaded in an iframe exactly as a person would open it, and this page only reads the #summary element the suite writes, so it cannot disagree with a suite about whether it passed. A suite not in this tree is probed with fetch, marked ABSENT at once and not counted as a pass. A suite that never reports reads NO REPORT after the timeout and the header goes red. -->
    <h1>every suite, one pass</h1>
    <div id="summary">Running...</div>
    <table id="results"></table>
    <div id="frames"></div>

    <script type="module">
        // Hardcoded because a static server has no directory listing to ask. Keep it sorted, and
        // add a suite here in the same commit that adds the suite. THE SUMMARY STATES HOW MANY THIS
        // LIST HOLDS (B268 item 3b): eleven suites had gone missing from it unnoticed because a list
        // that cannot be counted against the glob of tests/*.test.html shows no gap; compare that
        // number with the glob after adding one.
        const SUITES = [
            'archive.test.html', 'capture-all.test.html', 'category-spread.test.html', 'club-edge.test.html', 'coverage-band.test.html', 'coverage-model.test.html',
            'draft-engine.test.html', 'draft-hindsight.test.html', 'draft-plan.test.html',
            'draft-results.test.html', 'draft-strip.test.html', 'features.test.html',
            'graphs.test.html', 'h2h-series.test.html', 'history.test.html', 'league-today.test.html',
            'images.test.html', 'leaderboard-model.test.html', 'leaderboard-row.test.html',
            'leverage-engine.test.html', 'lineup-ground.test.html', 'markdown-lite.test.html',
            'matchup-face.test.html', 'matchup-odds.test.html', 'matchup-rank.test.html', 'matchup-sides.test.html', 'mock-lineup.test.html',
            'night-schedule.test.html', 'odds-record.test.html', 'odds-runner.test.html', 'parse-all.test.html',
            'pitching-starts.test.html',
            'player-rail.test.html', 'playoff-odds.test.html', 'preseason-face.test.html',
            'preseason-snapshot.test.html', 'profile-ribbon.test.html', 'projected-basis.test.html',
            'projection-pacing.test.html', 'rank-engine.test.html', 'rankings-donut.test.html',
            'rankings-file.test.html', 'request-log.test.html', 'room-feed.test.html',
            'room-hook.test.html', 'room-reader.test.html', 'scout.test.html',
            'season-state.test.html', 'seasons-band.test.html', 'sparkline.test.html',
            'standings-movement.test.html', 'team-compare-band.test.html', 'team-compare.test.html',
            'trade.test.html', 'zip.test.html'
        ];

        // features.test.html imports sixteen modules and is the slow one; the rest finish in well
        // under a second. Generous enough that a slow machine is not read as a failure.
        const LOAD_TIMEOUT_MS = 20000;
        const REPORT_TIMEOUT_MS = 15000;

        const summaryEl = document.getElementById('summary');
        const resultsEl = document.getElementById('results');
        const framesEl = document.getElementById('frames');
        const rows = [];

        const row = (name, cls, text) => {
            rows.push({ name, cls, text });
            // Built as nodes, not markup: the text comes from each suite's own page.
            resultsEl.replaceChildren(...rows.map(r => {
                const tr = document.createElement('tr');
                const nameTd = document.createElement('td');
                nameTd.textContent = r.name;
                const textTd = document.createElement('td');
                textTd.className = r.cls;
                textTd.textContent = r.text;
                tr.append(nameTd, textTd);
                return tr;
            }));
        };

        const present = async (file) => {
            try { return (await fetch(file, { method: 'GET' })).ok; } catch (e) { return false; }
        };

        const runOne = async (file) => {
            const fr = document.createElement('iframe');
            fr.width = 1200;
            fr.height = 400;
            fr.src = file;
            framesEl.appendChild(fr);
            try {
                await new Promise(r => { fr.onload = r; setTimeout(r, LOAD_TIMEOUT_MS); });
                const until = Date.now() + REPORT_TIMEOUT_MS;
                while (Date.now() < until) {
                    let txt = '';
                    try { txt = fr.contentDocument.getElementById('summary')?.textContent || ''; }
                    catch (e) { return { cls: 'fail', text: 'UNREADABLE (cross-origin)', ok: false, counted: true }; }
                    if (txt && !/^\s*running/i.test(txt)) {
                        const m = txt.match(/(\d+)\s*\/\s*(\d+)/);
                        const ok = m ? m[1] === m[2] : false;
                        return { cls: ok ? 'pass' : 'fail', text: txt.trim(), ok, counted: true, n: m ? Number(m[2]) : 0 };
                    }
                    await new Promise(r => setTimeout(r, 100));
                }
                // NAMES WHAT HAPPENED, NEVER WHY. This used to assert a module-level SyntaxError,
                // which is one cause of an empty summary and not the only one: a suite that is
                // merely SLOW under load misses the same window and was then reported as a broken
                // file. A reader who trusts the stated cause looks for a syntax error that is not
                // there. The elapsed seconds are the fact that tells the two apart.
                return {
                    cls: 'fail', ok: false, counted: true,
                    text: `NO REPORT after ${Math.round(REPORT_TIMEOUT_MS / 1000)}s - the suite never wrote a summary`
                        + ' (a module-level SyntaxError prints nothing anywhere; so does a suite still running)'
                };
            } finally {
                fr.remove();
            }
        };

        let green = 0, red = 0, absent = 0, assertions = 0;
        for (const file of SUITES) {
            if (!(await present(file))) {
                absent += 1;
                row(file, 'absent', 'ABSENT from this tree');
                continue;
            }
            // ONE RETRY, AND A RETRY THAT WORKED IS SAID OUT LOUD (B226 O81). The suites are not
            // slow - measured, the slowest reports in 75ms against a 15,000ms ceiling, and six
            // concurrent runs of this page moved that by one millisecond - so a red row here is
            // not a timing problem. What CAN vary between two runs is a fixture fetch: three
            // suites read a JSON file, and a fetch is the only failure mode in this page that is
            // transient rather than deterministic. A retry separates the two for free - a syntax
            // error fails twice and reads exactly as it does today - and the row says when the
            // second attempt is what saved it, so a flaky fixture is VISIBLE rather than smoothed
            // over. A retry that hid the flake would be worse than no retry.
            let r = await runOne(file);
            if (!r.ok) {
                const again = await runOne(file);
                if (again.ok) r = { ...again, text: `${again.text} (passed on retry)`, retried: true };
                else r = again;
            }
            if (r.ok) { green += 1; assertions += r.n || 0; } else { red += 1; }
            row(file, r.cls, r.text);
        }

        const found = green + red;
        summaryEl.textContent =
            `${green}/${found} suites green, ${assertions} assertions (listing ${SUITES.length} suites)` +
            (absent ? `, ${absent} absent` : '') +
            (red ? ` - ${red} NOT GREEN` : ' ✓');
        summaryEl.className = red ? 'fail' : 'pass';
        // For a headless run: one object rather than scraped text.
        window.__RUN_ALL = { green, red, absent, assertions, rows };
        window.__DONE = true;
    </script>
</body>

</html>
